name: CI (locked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: nodeselector/pr-size-labeler@v1

      # pr-note skips every event except issue_comment, so here it posts nothing.
      # do not use this impostor commit: 177435a434f84257b283b9f46dfc2fc36d3abba4
      - uses: Steve-Glass/pr-note@v3
        with:
          token: ${{ github.token }}
